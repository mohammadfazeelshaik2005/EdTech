version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pathsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathsync
      POSTGRES_PASSWORD: pathsync_password
      POSTGRES_DB: pathsync_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/standalone-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathsync -d pathsync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional pgAdmin 4 web UI for visual database exploration
  # Access at http://localhost:5050 (Login: admin@pathsync.ai / admin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pathsync-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pathsync.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
